<footer class="footer theme-dark">
  <div class="page-container footer-main">
    <div>
      <a routerLink="/" fragment="accueil" class="footer-brand" aria-label="Lunaas — Accueil">
        <img ngSrc="/images/brand/lunaas-logo-dark.webp" width="960" height="320" [alt]="site.name" loading="lazy" />
      </a>
      <p>{{ site.tagline }}</p>
    </div>
    <nav aria-label="Navigation de pied de page">
      @for (link of links; track link.fragment) {
      <a routerLink="/" [fragment]="link.fragment">{{ link.label }}</a>
      }
      <a routerLink="/" fragment="contact">Contact</a>
    </nav>
  </div>
  <div class="page-container footer-bottom">
    <span>Développement web indépendant · Bordeaux</span>
    <div>
      <a routerLink="/mentions-legales">Mentions légales</a>
      <a routerLink="/confidentialite">Confidentialité</a>
      <button type="button" class="analytics-preferences" aria-controls="analytics-consent-panel"
        [attr.aria-expanded]="consent.visible()" (click)="consent.open()">Gérer mes statistiques</button>
    </div>
  </div>
</footer>
