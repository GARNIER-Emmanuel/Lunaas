<header class="theme-dark">
  <nav aria-label="Navigation principale" class="page-container navigation">
    <a routerLink="/" class="brand" aria-label="Lunaas — Accueil" (click)="closeMenu()">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M25 24A13 13 0 0 1 10 4a13 13 0 1 0 15 20Z" fill="currentColor" />
      </svg>
      {{ site.name }}<span class="brand-dot">.</span>
    </a>
    <button
      #menuToggle
      class="menu-toggle"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="site-navigation"
      [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
      (click)="toggleMenu()"
    >
      Menu <span aria-hidden="true">{{ menuOpen() ? '×' : '+' }}</span>
    </button>
    <div id="site-navigation" class="nav-links" [class.is-open]="menuOpen()">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          ariaCurrentWhenActive="page"
          class="nav-link"
          (click)="closeMenu()"
          >{{ link.label }}</a
        >
      }
      <a routerLink="/contact" class="button button-secondary nav-contact" (click)="closeMenu()"
        >Parlons de votre projet <span aria-hidden="true">↗</span></a
      >
    </div>
  </nav>
</header>
