<section
  class="content-section cta-section"
  aria-labelledby="cta-title"
  (pointermove)="revealImage($event)"
  (pointerleave)="hideImage($event)"
  (pointercancel)="hideImage($event)"
>
  <div class="cta-reveal" aria-hidden="true">
    <picture>
      <source
        type="image/avif"
        srcset="/images/contact-mars-960.avif 960w, /images/contact-mars.avif 1920w"
        sizes="100vw"
      />
      <source
        type="image/webp"
        srcset="/images/contact-mars-960.webp 960w, /images/contact-mars.webp 1920w"
        sizes="100vw"
      />
      <img
        src="/images/contact-mars.webp"
        width="1920"
        height="653"
        alt=""
        loading="lazy"
        decoding="async"
      />
    </picture>
  </div>
  <div class="cta-disc" aria-hidden="true" data-parallax></div>
  <div class="page-container cta-layout">
    <div>
      <p class="section-label">La suite s’écrit ensemble</p>
      <h2 id="cta-title" data-motion>
        Votre prochain site<br /><span class="font-script">commence ici</span><span>.</span>
      </h2>
      <p data-motion>
        Vous avez une idée, un besoin ou simplement une question ?<br />Prenons le temps d’en
        parler.
      </p>
      <p class="cta-details">
        <a [href]="'mailto:' + emailAddress">{{ emailAddress }}</a
        ><br />{{ location }}
      </p>
    </div>
    <div class="cta-form-panel"><app-contact-form idPrefix="cta-contact" /></div>
  </div>
</section>
