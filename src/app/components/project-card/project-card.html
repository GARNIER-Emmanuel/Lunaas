<article [style.--project-accent]="project().accent">
  <a
    [routerLink]="['/realisations', project().slug]"
    class="project-cover"
    [attr.aria-label]="'Découvrir le projet ' + project().name"
  >
    <span class="cover-label">{{ project().label }}</span
    ><strong>{{ project().name }}<span>.</span></strong
    ><span class="cover-arrow" aria-hidden="true">↗</span>
  </a>
  <div class="project-meta">
    <span>{{ project().category }}</span>
  </div>
  <h3>
    <a [routerLink]="['/realisations', project().slug]">{{ project().name }}</a>
  </h3>
  <p>{{ project().summary }}</p>
  <ul class="tags" aria-label="Technologies">
    @for (technology of project().technologies.slice(0, 3); track technology) {
      <li>{{ technology }}</li>
    }
  </ul>
</article>
