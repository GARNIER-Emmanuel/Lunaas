<article [style.--project-accent]="project().accent">
  <img
    class="project-image"
    [ngSrc]="project().image.src"
    [alt]="project().image.alt"
    [width]="project().image.width"
    [height]="project().image.height"
  />
  <div class="project-details">
    <p class="project-meta">{{ project().category }}</p>
    <h3>
      <a [href]="project().live || project().repo || '#contact'"
        [attr.target]="project().live || project().repo ? '_blank' : null" rel="noopener noreferrer">{{ project().name
        }}</a>
    </h3>
    <p class="project-summary">{{ project().summary }}</p>
    @if (featured()) {
    <p class="project-goal">{{ project().goal }}</p>
    }
    <ul class="tags" aria-label="Technologies">
      @for (technology of project().technologies.slice(0, 3); track technology) {
      <li>{{ technology }}</li>
      }
    </ul>
    <a [href]="project().live || project().repo || '#contact'"
      [attr.target]="project().live || project().repo ? '_blank' : null" rel="noopener noreferrer"
      class="text-link project-link">Découvrir le projet <span aria-hidden="true">↗</span></a>
  </div>
</article>
