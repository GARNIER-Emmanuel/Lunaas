<section id="contact" class="content-section cta-section" aria-labelledby="cta-title" tabindex="-1"
  (pointermove)="revealImage($event)" (pointerleave)="hideImage($event)" (pointercancel)="hideImage($event)">
  <div class="cta-reveal" aria-hidden="true">
    <picture>
      <source type="image/avif" srcset="/images/contact-mars-960.avif 960w, /images/contact-mars.avif 1920w"
        sizes="100vw" />
      <source type="image/webp" srcset="/images/contact-mars-960.webp 960w, /images/contact-mars.webp 1920w"
        sizes="100vw" />
      <img src="/images/contact-mars.webp" width="1920" height="1080" alt="" loading="lazy" decoding="async" />
    </picture>
  </div>
  <div class="page-container cta-layout">
    <div>
      <h2 id="cta-title" class="section-title section-title--compact" data-motion>
        Votre site, vos besoins<br /><span class="font-script">Parlons-en</span>
      </h2>
      <p data-motion>
        Vous avez une idée, un besoin ou simplement une question ?<br />Prenons le temps d’en
        parler.
      </p>
    </div>
    <div class="cta-form-panel">
      <app-contact-form idPrefix="cta-contact" [offerSelection]="offerSelection()" />
    </div>
  </div>
</section>
