<section id="accueil" class="hero theme-dark" aria-labelledby="homepage-title">
  <canvas #reveal class="hero-reveal" aria-hidden="true"></canvas>
  <div class="page-container hero-layout">
    <div class="hero-copy">
      <p class="eyebrow" data-motion="hero">Lunaas / Développement web indépendant</p>
      <h1 id="homepage-title" class="hero-title" data-motion="hero">{{ site.homepage.title }}</h1>
      <p class="hero-signature" data-motion="hero">
        <span class="font-script">{{ site.homepage.highlight }}</span>
      </p>
      <div class="hero-summary" data-motion="hero">
        <p class="hero-description">{{ site.homepage.description }}</p>
        <div class="hero-actions">
          <a href="#contact" class="button button-primary">Parlons de votre projet </a>
          <a href="#approche" class="button button-secondary">Découvrir l'approche</a>
        </div>
      </div>
    </div>
  </div>
</section>
