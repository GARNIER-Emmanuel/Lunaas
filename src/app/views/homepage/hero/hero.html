<section id="accueil"
  class="hero theme-dark"
  aria-labelledby="homepage-title"
  (pointermove)="revealImage($event)"
  (pointerleave)="hideImage($event)"
>
  <div class="hero-reveal" aria-hidden="true"></div>
  <div class="page-container hero-layout">
    <div class="hero-copy">
      <p class="eyebrow" data-motion="hero">Lunaas / Développement web indépendant</p>
      <h1 id="homepage-title" data-motion="hero">
        <span class="hero-title"
          >{{ site.homepage.headline
          }}<span class="font-script">{{ site.homepage.highlight }}</span></span
        >
        <span class="hero-location">{{ site.homepage.title }}</span>
      </h1>
      <div class="hero-summary" data-motion="hero">
        <p class="hero-description">{{ site.homepage.description }}</p>
        <div class="hero-actions">
          <a href="#contact" class="button button-primary"
            >Parlons de votre projet <span aria-hidden="true">↗</span></a
          >
          <a href="#approche" class="button button-secondary"
            >Découvrir l'approche <span aria-hidden="true">↓</span></a
          >
        </div>
      </div>
    </div>
  </div>
  <div class="page-container hero-bottom">
    <span>De la première idée à la mise en ligne.</span>
    <a href="#approche" class="explore-link"
      >Faire défiler <span class="scroll-arrow" aria-hidden="true">↓</span></a
    >
  </div>
</section>
