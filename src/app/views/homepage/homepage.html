<section id="approche" aria-labelledby="approach-title" class="approach-section">
  <div class="page-container">
    <div class="section-heading">
      <p>L'approche Lunaas</p>
      <h2 id="approach-title">Votre projet, accompagné<br />de près.</h2>
    </div>
    <div class="approach-grid">
      @for (item of approach; track item.title; let i = $index) {
        <article>
          <span class="step-number" aria-hidden="true">0{{ i + 1 }}</span>
          <h3>{{ item.title }}</h3>
          <p>{{ item.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
