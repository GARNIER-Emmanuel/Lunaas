<section id="faq" class="content-section" aria-labelledby="faq-title">
  <div class="page-container faq-layout">
    <div>
      <p class="section-label" data-motion>Questions fréquentes</p>
      <h2 id="faq-title" class="section-title section-title--compact" data-motion>
        Les bonnes questions<br /><span class="font-script">Avant de commencer</span>
      </h2>
      <p class="section-description">
        Budget, délais, contenus : quelques repères pour préparer notre échange.
      </p>
    </div>
    <div class="questions" data-motion>
      @for (item of items; track item.question) {
        <details [attr.id]="item.id">
          <summary>
            <span>{{ item.question }}</span
            ><span class="faq-toggle" aria-hidden="true"></span>
          </summary>
          <p>{{ item.answer | sentenceLines }}</p>
        </details>
      }
    </div>
  </div>
</section>
