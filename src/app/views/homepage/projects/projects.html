<section id="realisations" class="content-section" aria-labelledby="projects-title">
  <div class="page-container">
    <h2 id="projects-title" class="section-title" data-motion>Les idées prennent forme<br /><span
        class="font-script">Les usages aussi</span></h2>
    <p class="section-description" data-motion>
      Un projet personnel pour découvrir ma façon de concevoir une application, de relier ses
      fonctionnalités et de la rendre utilisable au quotidien.
    </p>
    <div class="project-grid">
      @for (project of projects; track project.slug) {
      <app-project-card [project]="project" [featured]="true" data-motion />
      }
    </div>
  </div>
</section>
