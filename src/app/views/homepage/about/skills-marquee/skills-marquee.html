<div class="skills-banner theme-dark" role="region" aria-label="Les technologies que je pratique" tabindex="0">
  <div class="skills-viewport">
    <div id="skills-track" class="skills-track">
      <ul class="skills-list" role="list">
        @for (skill of skills(); track skill) {
        <li><span class="skill-dot" aria-hidden="true"></span>{{ skill }}</li>
        }
      </ul>
      <ul class="skills-list skills-copy" aria-hidden="true">
        @for (skill of skills(); track skill) {
        <li><span class="skill-dot"></span>{{ skill }}</li>
        }
      </ul>
    </div>
  </div>
</div>
