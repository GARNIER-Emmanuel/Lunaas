<div class="skills-banner theme-dark" role="region" aria-labelledby="skills-banner-label">
  <div class="page-container skills-heading">
    <p id="skills-banner-label">Les technologies que je pratique</p>
  </div>
  <div class="skills-viewport">
    <div class="skills-track" [class.is-paused]="paused()">
      <ul class="skills-list" role="list">
        @for (skill of skills(); track skill) {
        <li><span class="skill-dot" aria-hidden="true"></span>{{ skill }}</li>
        }
      </ul>
      <ul class="skills-list skills-copy" aria-hidden="true">
        @for (skill of skills(); track skill) {
        <li><span class="skill-dot"></span>{{ skill }}</li>
        }
      </ul>
    </div>
  </div>
</div>
