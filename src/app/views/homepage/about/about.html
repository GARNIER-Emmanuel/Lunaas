<section id="a-propos" class="content-section" aria-labelledby="about-title">
  <div class="page-container about-layout">
    <div class="profile-panel" data-motion>
      <p class="section-label">Derrière Lunaas</p>
      <div class="profile-mark" aria-hidden="true" data-parallax>{{ initials }}<span>.</span></div>
      <p class="profile-name">
        {{ profile.name }}<span>{{ profile.role }}</span>
      </p>
    </div>
    <div class="about-copy">
      <h2 id="about-title" class="section-title section-title--compact" data-motion>
        Un développeur.<br />Un échange direct.<br /><span class="font-script">Votre projet en commun.</span>
      </h2>
      <p class="section-description" data-motion>{{ profile.introduction }}</p>
      <a href="#contact" class="text-link"
        >Faire connaissance <span aria-hidden="true">↗</span></a
      >
    </div>
  </div>
</section>
