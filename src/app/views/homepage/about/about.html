<section id="a-propos" class="content-section" aria-labelledby="about-title">
  <div class="page-container">
    <div class="about-layout">
      <div class="about-copy">
        <p class="section-label" data-motion>À propos</p>
        <h2 id="about-title" class="section-title section-title--compact" data-motion>
          {{ profile.name }}<br /><span class="font-script">{{ profile.role }}</span>
        </h2>
        <p class="section-description" data-motion>{{ profile.introduction }}</p>
      </div>
      <div class="profile-portrait">
        <img
          ngSrc="/images/mypicture.webp"
          width="1200"
          height="1601"
          [alt]="'Portrait de ' + profile.name"
          loading="lazy"
        />
      </div>
    </div>
  </div>
  <app-skills-marquee [skills]="profile.skills" />
  <div class="page-container">
    <app-trusted-companies />
  </div>
</section>
